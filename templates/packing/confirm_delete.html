{% extends "base.html" %}
{% block title %}Delete {{ kind }} · PackReady{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h2 class="h4">Delete this {{ kind }}?</h2>
    <p>You are about to delete <strong>{{ object_name }}</strong>. {{ warning }}</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger">Yes, delete</button>
      <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
