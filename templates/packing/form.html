{% extends "base.html" %}
{% block title %}{{ title }} · PackReady{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h2 class="h4 mb-3">{{ title }}</h2>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "accounts/_form_fields.html" %}
      <button class="btn btn-dark">Save</button>
      <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
