{% extends "base.html" %}
{% block title %}My Dashboard · PackReady{% endblock %}
{% block content %}
<h2>Welcome, {{ user.first_name|default:user.username }}! 🧳</h2>
<p class="text-muted">Plan your trips and never forget an item again.</p>
<div class="row g-3">
  <div class="col-md-4"><div class="card p-3"><h5>My Trips</h5><p class="mb-0 text-muted">Coming soon</p></div></div>
  <div class="col-md-4"><div class="card p-3"><h5>Packing Lists</h5><p class="mb-0 text-muted">Coming soon</p></div></div>
  <div class="col-md-4"><div class="card p-3"><h5>My Profile</h5><a href="{% url 'accounts:profile' %}">View or edit</a></div></div>
</div>
{% endblock %}
