{% extends "base.html" %}
{% block title %}Login · PackReady{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h2 class="h4 mb-3">Log in</h2>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "accounts/_form_fields.html" %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-dark w-100">Log in</button>
      </form>
      <p class="mt-3 mb-0 small">No account yet? <a href="{% url 'accounts:register' %}">Register</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
