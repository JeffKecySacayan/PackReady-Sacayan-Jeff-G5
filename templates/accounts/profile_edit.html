{% extends "base.html" %}
{% block title %}Edit Profile · PackReady{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h2 class="h4 mb-3">Edit profile</h2>
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% include "accounts/_form_fields.html" %}
      <button class="btn btn-dark">Save changes</button>
      <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
